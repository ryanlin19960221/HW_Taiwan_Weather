name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 設定 GITHUB_TOKEN 的權限以支援 GitHub Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只允許一個 Pages 部署執行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_CWA_API_KEY: ${{ secrets.CWA_API_KEY || 'CWA-652E4A95-7B9A-4069-8971-B1D410717934' }}
          NEXT_PUBLIC_CWA_PRIMARY_DATASET: 'O-A0003-001'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
